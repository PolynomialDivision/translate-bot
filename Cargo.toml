[package]
name = "translate-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "translate-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3"
mxbot-common = { git = "https://github.com/PolynomialDivision/mxbot-common" }
pulldown-cmark = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Already pulled in transitively via matrix-sdk's "sqlite" feature
# (matrix-sdk-sqlite); declared directly so translate-bot can keep its own
# sibling database in the same store/ directory, following the precedent
# set by radar-bot's store/items.db alongside store/matrix_store/.
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
toml = "1"
